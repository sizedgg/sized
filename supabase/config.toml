project_id = "sized"

[functions.verify]
# Must be reachable without login - this is where the session is created.
verify_jwt = false

[functions.refresh-holdings]
# Checks the wallet JWT itself (or the CRON_SECRET header), so the cron
# job can get through without a Supabase auth token too.
verify_jwt = false

[functions.holdings-webhook]
# Helius cannot send a Supabase JWT; the function instead checks a
# freely chosen auth header against WEBHOOK_SECRET.
verify_jwt = false

[functions.og]
# The preview images for shared polls. X's crawler sends no Supabase JWT -
# without this line the function answers it with 401 and a shared link
# shows no card.
#
# It was missing for a long time, and nobody noticed: the function was
# mentioned in neither of the two READMEs, nor in this file. Anyone who
# followed the setup guide never deployed it at all.
verify_jwt = false
